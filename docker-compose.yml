version: '3.8'

services:
  # Q-BIT Main Application
  qbit-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qbit-main
    restart: unless-stopped
    environment:
      - QBIT_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://qbit:qbit_password@postgres:5432/qbit
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"  # Main API
      - "8001:8001"  # WebSocket
      - "8002:8002"  # Monitoring
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - redis
      - postgres
    networks:
      - qbit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: qbit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - qbit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: qbit-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=qbit
      - POSTGRES_USER=qbit
      - POSTGRES_PASSWORD=qbit_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - qbit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbit -d qbit"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: qbit-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - qbit-network

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: qbit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - qbit-network
    depends_on:
      - prometheus

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: qbit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - qbit-app
    networks:
      - qbit-network

  # Agent scaling service (for horizontal scaling)
  qbit-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - QBIT_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://qbit:qbit_password@postgres:5432/qbit
      - AGENT_MODE=worker
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - redis
      - postgres
      - qbit-app
    networks:
      - qbit-network
    deploy:
      replicas: 3
    command: ["python", "-m", "src.agents.worker", "--mode", "distributed"]

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  qbit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
